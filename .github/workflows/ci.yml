name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Software GL (SwiftShader) draws the multisample frame target slowly. The suite runs in shards,
  # per test, not per file, so the long layout spec spreads too; the `@heavy` specs (several
  # presets or views stepped frame by frame) have shards of their own, so they do not set the pace
  # of the rest. Every test runs in exactly one shard: `--grep` and `--grep-invert` split the suite.
  # Skipped on push to main: the ruleset's strict required status checks (no bypass) make the
  # merged tree the tree its PR ran e2e on; revisit this `if` if that changes. `workflow_dispatch`
  # still runs it.
  e2e:
    if: github.event_name != 'push'
    name: e2e (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: heavy, shard: 1, shards: 3, filter: '--grep @heavy' }
          - { suite: heavy, shard: 2, shards: 3, filter: '--grep @heavy' }
          - { suite: heavy, shard: 3, shards: 3, filter: '--grep @heavy' }
          - { suite: light, shard: 1, shards: 2, filter: '--grep-invert @heavy' }
          - { suite: light, shard: 2, shards: 2, filter: '--grep-invert @heavy' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BASE_PATH: /gegenlenker/
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-
      # `--with-deps` installs the font set text metrics depend on; the .debs are cached so the
      # mirror is not hit on every run.
      - id: debs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-debs
          key: playwright-debs-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Seed apt with cached .debs
        run: |
          mkdir -p ~/.cache/playwright-debs
          if compgen -G "$HOME/.cache/playwright-debs/*.deb" >/dev/null; then
            sudo cp --update=none "$HOME"/.cache/playwright-debs/*.deb /var/cache/apt/archives/
          fi
      - run: pnpm exec playwright install --with-deps chromium
      - name: Collect .debs for the cache
        if: steps.debs.outputs.cache-hit != 'true'
        run: |
          if compgen -G '/var/cache/apt/archives/*.deb' >/dev/null; then
            cp --update=none /var/cache/apt/archives/*.deb ~/.cache/playwright-debs/
          else
            echo '::warning::no .debs to cache'
          fi
      - run: pnpm test:e2e --fully-parallel ${{ matrix.filter }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/e2e-results-${{ matrix.suite }}-${{ matrix.shard }}.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.suite }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-results-${{ matrix.suite }}-${{ matrix.shard }}.json
          overwrite: true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.suite }}-${{ matrix.shard }}
          path: test-results/

  # The required status check. `always()` keeps it running when a dependency
  # fails, so it fails instead of being skipped (a skipped check can pass).
  # Required: every need succeeds; on push only, e2e may be skipped.
  check:
    needs: [lint, unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          printf '%s' "$NEEDS" | jq -c 'map_values(.result)'
          printf '%s' "$NEEDS" | jq -e --arg event "$EVENT" '
            length > 0 and all(to_entries[];
              .value.result == "success"
              or (.key == "e2e" and $event == "push" and .value.result == "skipped"))'

  build-pages:
    needs: check
    # Implicit `success()` also counts skipped ancestors (e2e on push), so test the result itself;
    # `deploy` does the same.
    if: >-
      !cancelled() && needs.check.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    # Job level, so a skipped run never cancels a pending deploy.
    concurrency:
      group: pages-build
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BASE_PATH: /gegenlenker/
      - run: grep -q 'src="/gegenlenker/assets/' dist/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build-pages
    if: ${{ !cancelled() && needs.build-pages.result == 'success' }}
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
