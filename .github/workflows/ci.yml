name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# PRs cancel their own earlier runs. Pushes to `develop` share one group without cancelling, so the
# running one finishes (e2e included) and only the newest waiting one is kept: merges arriving faster
# than e2e still get the latest tree tested. `main` runs never wait or cancel.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || (github.event_name == 'push' && github.ref == 'refs/heads/develop' && 'develop') || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Steps, not a job: `check` fails on a skipped need. No ruleset rule restricts a PR's head
      # branch, and the guard catches mistakes only (a PR can edit it, and a base change is the
      # `edited` activity, which starts no run). The gate is `/release` (`.claude/skills/release`),
      # which merges into `main` only once this step and `Check the release tree` succeeded in the
      # PR's own run (it matches both by name), then hands the owner the merge. A fork's `release/*`
      # head is no release branch either.
      - name: Only release and hotfix branches open PRs into main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PRs into main must come from this repository, not $HEAD_REPO"; exit 1
          fi
          case "$HEAD_REF" in
            release/* | hotfix/*) ;;
            *) echo "::error::PRs into main come from release/* or hotfix/* only, not $HEAD_REF"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # `release:check` compares the head version with the local `v` tags, which a checkout omits.
      # A fetch whose refspec matches no tag fails, so `ls-remote` asks first (exit 2: none yet).
      - name: Check the release tree
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          status=0
          git ls-remote --exit-code --tags --refs origin 'refs/tags/v*' > /dev/null || status=$?
          if [ "$status" = 0 ]; then
            git fetch --depth=1 origin 'refs/tags/v*:refs/tags/v*'
          elif [ "$status" != 2 ]; then
            exit "$status"
          fi
          pnpm release:check
      # The e2e slice table must partition each class: one `n` per class, every `1..n` once.
      - name: Check e2e slice table
        run: |
          grep -o "id: [0-9]*, runs: '[^']*'" .github/workflows/ci.yml | sed "s/.*runs: '//; s/'$//" | tr ' ' '\n' |
            awk -F'[:/]' '
              { if ($1 in n && n[$1] != $3) bad = bad " " $0; n[$1] = $3
                if ($2 < 1 || $2 > $3 || seen[$1, $2]++) bad = bad " " $0 }
              END {
                split("heavy slow layout light", want, " ")
                for (k in want) {
                  c = want[k]
                  if (!(c in n)) bad = bad " " c ":none"
                  for (i = 1; i <= n[c]; i++) if (!seen[c, i]) bad = bad " " c ":" i "/" n[c]
                }
                for (c in n) if (c != "heavy" && c != "slow" && c != "layout" && c != "light") bad = bad " " c
                if (bad) { print "e2e slice table is not a partition:" bad; exit 1 }
              }'

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Software GL (SwiftShader) draws the multisample frame target slowly. Playwright cuts a suite
  # into runs of equal test count, so the suite is first split by cost class: `@heavy` (Balanced and
  # High draws, preset comparisons, many stepped frames), `@slow` (several times a `@heavy` test),
  # the layout spec (many short tests), and the rest (`light`). Each class is cut into slices
  # (`suite:i/n` in `runs`) and each job runs the slices packed to even its cost, from recorded
  # per-test durations. Retune the table when a class's cost shifts; the lint job checks that every
  # `i` of each class appears in exactly one job, so each test runs once. Keep the job count under
  # the account's concurrent-job limit, or the last jobs queue.
  # Skipped on push to `main`: its strict ruleset (no bypass) makes the merged tree the tree its PR
  # ran e2e on. The `develop` ruleset is not strict, so a PR's e2e may have run on a base that has
  # since moved: pushes to `develop` run it (a superseded waiting run is dropped for the newer one),
  # and `check` requires it there.
  e2e:
    if: github.event_name != 'push' || github.ref == 'refs/heads/develop'
    name: e2e ${{ matrix.id }} (${{ matrix.runs }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: 1, runs: 'layout:4/12 heavy:5/16 heavy:6/16' }
          - { id: 2, runs: 'layout:6/12 light:3/6 heavy:1/16' }
          - { id: 3, runs: 'slow:4/8 heavy:9/16' }
          - { id: 4, runs: 'heavy:10/16 heavy:4/16' }
          - { id: 5, runs: 'heavy:13/16 layout:7/12 layout:1/12' }
          - { id: 6, runs: 'layout:11/12 layout:9/12' }
          - { id: 7, runs: 'heavy:11/16 layout:10/12' }
          - { id: 8, runs: 'slow:3/8 heavy:12/16' }
          - { id: 9, runs: 'slow:6/8 layout:8/12' }
          - { id: 10, runs: 'layout:3/12 heavy:15/16 light:5/6' }
          - { id: 11, runs: 'heavy:16/16 heavy:7/16' }
          - { id: 12, runs: 'layout:5/12 light:1/6 light:6/6' }
          - { id: 13, runs: 'heavy:8/16 heavy:3/16 light:4/6' }
          - { id: 14, runs: 'heavy:14/16 slow:8/8' }
          - { id: 15, runs: 'layout:12/12 light:2/6' }
          - { id: 16, runs: 'slow:7/8 heavy:2/16' }
          - { id: 17, runs: 'slow:5/8 slow:1/8' }
          - { id: 18, runs: 'layout:2/12 slow:2/8' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BASE_PATH: /gegenlenker/
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-
      # `--with-deps` installs the font set text metrics depend on; the .debs are cached so the
      # mirror is not hit on every run.
      - id: debs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-debs
          key: playwright-debs-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Seed apt with cached .debs
        run: |
          mkdir -p ~/.cache/playwright-debs
          if compgen -G "$HOME/.cache/playwright-debs/*.deb" >/dev/null; then
            sudo cp --update=none "$HOME"/.cache/playwright-debs/*.deb /var/cache/apt/archives/
          fi
      - run: pnpm exec playwright install --with-deps chromium
      - name: Collect .debs for the cache
        if: steps.debs.outputs.cache-hit != 'true'
        run: |
          if compgen -G '/var/cache/apt/archives/*.deb' >/dev/null; then
            cp --update=none /var/cache/apt/archives/*.deb ~/.cache/playwright-debs/
          else
            echo '::warning::no .debs to cache'
          fi
      # Every slice runs even after a failure; `--output` keeps each slice's traces apart.
      - name: Run e2e slices
        env:
          RUNS: ${{ matrix.runs }}
          RESULTS: ${{ runner.temp }}/e2e-results-${{ matrix.id }}
        run: |
          status=0
          n=0
          for run in $RUNS; do
            n=$((n + 1))
            case "${run%%:*}" in
              heavy) filter=(--grep @heavy) ;;
              slow) filter=(--grep @slow) ;;
              layout) filter=(--grep layout.spec) ;;
              light) filter=(--grep-invert '@heavy|@slow|layout.spec') ;;
              *) echo "unknown suite in $run" >&2; exit 1 ;;
            esac
            PLAYWRIGHT_JSON_OUTPUT_NAME="$RESULTS-$n.json" pnpm test:e2e --fully-parallel "${filter[@]}" --shard="${run#*:}" --output="test-results/$n" --reporter=list,json || status=1
          done
          exit "$status"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.id }}
          path: ${{ runner.temp }}/e2e-results-${{ matrix.id }}-*.json
          overwrite: true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.id }}
          path: test-results/

  # Advisory: not in `check.needs`. Software WebGPU (SwiftShader, Chromium's new headless mode)
  # builds every pipeline of each preset, so a WGSL error fails here. Skipped on push.
  webgpu:
    if: github.event_name != 'push'
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BASE_PATH: /gegenlenker/
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-
      - id: debs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-debs
          key: playwright-debs-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Seed apt with cached .debs
        run: |
          mkdir -p ~/.cache/playwright-debs
          if compgen -G "$HOME/.cache/playwright-debs/*.deb" >/dev/null; then
            sudo cp --update=none "$HOME"/.cache/playwright-debs/*.deb /var/cache/apt/archives/
          fi
      - run: pnpm exec playwright install --with-deps chromium
      - name: Collect .debs for the cache
        if: steps.debs.outputs.cache-hit != 'true'
        run: |
          if compgen -G '/var/cache/apt/archives/*.deb' >/dev/null; then
            cp --update=none /var/cache/apt/archives/*.deb ~/.cache/playwright-debs/
          else
            echo '::warning::no .debs to cache'
          fi
      - run: pnpm test:e2e:webgpu
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-webgpu
          path: test-results/

  # The UAT build shares the production origin and scope prefix: the production dist with a UAT build
  # inside `uat/` proves each channel leaves the other's pages, keys and caches alone. Unlike e2e it
  # also runs on every push, because `check` tolerates a skipped e2e only on `main`.
  channels:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BASE_PATH: /gegenlenker/
      # `build-pages` repeats these on `main`, after the merge; here they gate the PR.
      - name: Verify the production build is deterministic and has a manifest
        run: |
          pnpm build --outDir "$RUNNER_TEMP/dist-again" --emptyOutDir
          diff -r dist "$RUNNER_TEMP/dist-again"
          node scripts/prod-manifest.mjs dist > prod-manifest.txt
          (cd dist && sha256sum --check --quiet --strict ../prod-manifest.txt)
        env:
          BASE_PATH: /gegenlenker/
      - run: pnpm build --outDir dist/uat
        env:
          BASE_PATH: /gegenlenker/uat/
          DEPLOY_CHANNEL: uat
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          restore-keys: playwright-${{ runner.os }}-
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:channels
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-channels
          path: test-results/

  # The required status check. `always()` keeps it running when a dependency
  # fails, so it fails instead of being skipped (a skipped check can pass).
  # Required: every need succeeds; only on a push to `main` may e2e be skipped.
  check:
    needs: [lint, unit, e2e, channels]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          printf '%s' "$NEEDS" | jq -c 'map_values(.result)'
          printf '%s' "$NEEDS" | jq -e --arg event "$EVENT" --arg ref "$REF" '
            length > 0 and all(to_entries[];
              .value.result == "success"
              or (.key == "e2e" and $event == "push" and $ref == "refs/heads/main" and .value.result == "skipped"))'

  build-pages:
    needs: check
    # Implicit `success()` also counts skipped ancestors (e2e on push), so test the result itself;
    # `deploy` does the same.
    if: >-
      !cancelled() && needs.check.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    # Job level, so a skipped run never cancels a pending deploy.
    concurrency:
      group: pages-build
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BASE_PATH: /gegenlenker/
      - run: grep -q 'src="/gegenlenker/assets/' dist/index.html
      # The `develop` deploy reuses the uploaded bytes and never rebuilds production. Regenerating an
      # expired artifact does rebuild, so a second clean build must match the first; this proves it
      # on one runner and toolchain only (`.nvmrc` and `ubuntu-latest` float).
      - name: Verify the build is deterministic
        run: |
          pnpm build --outDir "$RUNNER_TEMP/dist-again" --emptyOutDir
          diff -r dist "$RUNNER_TEMP/dist-again"
        env:
          BASE_PATH: /gegenlenker/
      - name: Write the production manifest
        run: |
          node scripts/prod-manifest.mjs dist > prod-manifest.txt
          (cd dist && sha256sum --check --quiet --strict ../prod-manifest.txt)
          printf '%s\n' "$GITHUB_SHA" > prod-commit.txt
      # `deploy-uat` republishes these bytes beside the UAT build (`tools/uat-pages.ts`). Artifacts
      # expire (`retention-days` is capped by the repository setting, 90 days at most), but `main`
      # changes only when a release is cut. Once the artifact has expired, run this workflow with
      # `workflow_dispatch` on `main`: it uploads a new one and redeploys production from the same
      # build, so both match once that deploy is live.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prod-dist-${{ github.sha }}
          path: |
            dist
            prod-manifest.txt
            prod-commit.txt
          retention-days: 90
          if-no-files-found: error
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Production publishes its dist alone, so a release needs nothing from `develop`; `/uat/` is gone
  # until a UAT deploy runs. One `pages` group for every deploy job: `queue: max` keeps every
  # pending deploy instead of replacing the waiting one with the newest
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idconcurrency).
  deploy:
    needs: build-pages
    if: ${{ !cancelled() && needs.build-pages.result == 'success' }}
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # `develop` deploys the UAT build to `/gegenlenker/uat/`; the Pages artifact also republishes the
  # production dist of the live `main` deploy, never rebuilt. The develop checkout only builds; the
  # job that reads deployments and publishes runs `main`'s `tools/uat-pages.ts`, which only a release
  # changes. The job itself is `develop`'s, so PR review of `develop` is the boundary. It needs the
  # fast jobs, not `check`: UAT does not wait for its own run's e2e (only for the previous `develop`
  # run), so a red e2e leaves UAT deployed.
  build-uat:
    needs: [lint, unit, channels]
    if: >-
      !cancelled() && needs.lint.result == 'success' && needs.unit.result == 'success' &&
      needs.channels.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --outDir dist/uat
        env:
          BASE_PATH: /gegenlenker/uat/
          DEPLOY_CHANNEL: uat
      - run: grep -q 'src="/gegenlenker/uat/assets/' dist/uat/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uat-dist-${{ github.sha }}
          path: dist/uat
          if-no-files-found: error

  # The production lookup runs inside the group, so a `main` deploy that landed meanwhile is the one
  # republished, never an older dist. Environment `uat-pages` has no reviewer.
  deploy-uat:
    needs: build-uat
    if: ${{ !cancelled() && needs.build-uat.result == 'success' }}
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: uat-pages
      url: ${{ steps.deployment.outputs.page_url }}uat/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Assemble production and UAT
        run: |
          if [ ! -f tools/uat-pages.ts ]; then
            echo "::error::main has no tools/uat-pages.ts: UAT deploys start once a release brings it there"
            exit 1
          fi
          node tools/uat-pages.ts "$RUNNER_TEMP/pages"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Tags and publishes the GitHub Release once the version is live; a no-op while released.json
  # has no versioned head group. The only job with `contents: write`.
  release:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release-publish.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
